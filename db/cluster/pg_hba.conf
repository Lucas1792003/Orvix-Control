# Orvix Control cluster pg_hba.conf (C1.3 M3). First match wins.
#
# The control roles (control_app, control_sentinel) may connect ONLY to control databases. Every other database in the
# cluster (postgres, template1, anything else) is rejected for them, so the per-database hardening of migrations
# 200-221 cannot be sidestepped from a sibling database (C1.2 runtime finding M-1).
#
# Local socket: the control roles never use it (they connect over TCP with a password); everyone else is the image's
# entrypoint and host maintenance (pg_dump/pg_restore via docker exec).
local   all             control_app,control_sentinel                                     reject
local   all             all                                                              trust
# Control roles: control databases only (regular expression database names need PostgreSQL 16+; no comma allowed).
host    /^orvix_control(_e2e|_test_[a-z0-9]+)?$  control_app,control_sentinel  all  scram-sha-256
host    all             control_app,control_sentinel                       all           reject
# Everything else (the superuser and other roles) as in the stock image.
host    all             all                                                all           scram-sha-256
